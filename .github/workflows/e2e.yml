name: E2E Smoke Tests (Playwright)

# Runs the Playwright suite in e2e/ against a deployed site:
#   - after every Vercel deployment (staging/preview via `nextjs`, and production)
#   - nightly against production (scheduled runs only fire from the default branch)
#   - manually, against any URL
on:
  deployment_status:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (defaults to https://www.kabatone.com)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.deployment.ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: |
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Preview' ||
        github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.target_url || inputs.base_url || 'https://www.kabatone.com' }}
      # Optional: lets the suite through Vercel Deployment Protection on preview URLs.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite against ${{ env.E2E_BASE_URL }}
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
