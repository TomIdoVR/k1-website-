name: Production Health Check & Auto-Rollback

on:
  # Triggers after Vercel deploys to production
  deployment_status:
  # Fallback: check every 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  # Manual trigger
  workflow_dispatch:

env:
  # Canonical apex domain. www.kabatone.com 308-redirects here, so pointing the
  # health check at www made every scheduled run fail on the redirect (v2.335).
  SITE_URL: https://kabatone.com

# The default GITHUB_TOKEN is read-only, which made the incident-issue step
# 403 on every real failure. Grant only what that step needs.
permissions:
  contents: read
  issues: write

jobs:
  health-check:
    # Run on: successful production deploys, scheduled, or manual trigger
    if: |
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to propagate
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Check site health
        id: check
        run: |
          HEALTHY=false
          for i in 1 2 3; do
            STATUS=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true
              break
            fi
            sleep 10
          done

          # Also verify Spanish locale works (middleware + i18n)
          if [ "$HEALTHY" = "true" ]; then
            ES_STATUS=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL/es")
            echo "ES locale: HTTP $ES_STATUS"
            if [ "$ES_STATUS" != "200" ]; then
              HEALTHY=false
            fi
          fi

          echo "healthy=$HEALTHY" >> "$GITHUB_OUTPUT"
          if [ "$HEALTHY" = "false" ]; then
            echo "::error::Site health check FAILED"
          fi

      - name: Find and promote last working deployment
        if: steps.check.outputs.healthy == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          echo "🚨 Site is down! Finding last working deployment..."

          API="https://api.vercel.com"

          # The deployment currently serving production is, by definition, the one
          # that just failed the health check. It must never be a rollback target --
          # promoting it back onto itself is what this step used to do.
          CURRENT=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$API/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            | jq -r '.targets.production.id // .targets.production.uid // empty')
          echo "Currently live: ${CURRENT:-<unknown>}"

          RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$API/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=production&limit=20&state=READY")

          # Newest first, so we roll back the shortest distance that works.
          echo "$RESPONSE" | jq -r '.deployments | sort_by(.created) | reverse | .[] | "\(.uid) \(.url)"' > candidates.txt

          if [ ! -s candidates.txt ]; then
            echo "::error::Vercel API returned no READY production deployments"
            exit 1
          fi

          PROMOTED=""
          while read -r DEP_ID DEP_URL; do
            [ -z "$DEP_ID" ] && continue

            if [ "$DEP_ID" = "$CURRENT" ]; then
              echo "Skip $DEP_URL -- currently live, this is the deployment that failed"
              continue
            fi

            # Validate a candidate the same way production is validated. A build that
            # only serves / is not a working rollback target if /es is broken.
            ROOT=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "https://$DEP_URL")
            ES=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "https://$DEP_URL/es")
            echo "Testing $DEP_URL -> / $ROOT, /es $ES"
            if [ "$ROOT" != "200" ] || [ "$ES" != "200" ]; then
              continue
            fi

            echo "Promoting $DEP_ID ($DEP_URL)"
            PROMOTE_RESULT=$(curl -s -w '\n%{http_code}' -X POST \
              "$API/v10/projects/$VERCEL_PROJECT_ID/promote/$DEP_ID?teamId=$VERCEL_TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json")
            PROMOTE_CODE=$(echo "$PROMOTE_RESULT" | tail -n1)
            PROMOTE_BODY=$(echo "$PROMOTE_RESULT" | sed '$d')
            echo "Promote HTTP $PROMOTE_CODE: $PROMOTE_BODY"

            case "$PROMOTE_CODE" in
              2*) PROMOTED="$DEP_ID"; break ;;
              *)  echo "Promote rejected -- trying next candidate" ;;
            esac
          done < candidates.txt

          if [ -z "$PROMOTED" ]; then
            echo "::error::No healthy rollback candidate found"
            exit 1
          fi

          # Confirm production actually recovered rather than assuming it did.
          for i in 1 2 3 4 5 6; do
            sleep 10
            V_ROOT=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL")
            V_ES=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 10 "$SITE_URL/es")
            echo "Verify $i: / $V_ROOT, /es $V_ES"
            if [ "$V_ROOT" = "200" ] && [ "$V_ES" = "200" ]; then
              echo "✅ Rolled back to $PROMOTED -- production healthy"
              exit 0
            fi
          done

          echo "::error::Promoted $PROMOTED but production is still unhealthy"
          exit 1

      - name: Create or update incident issue
        if: steps.check.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Avoid duplicate issues — check for open incidents
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
              per_page: 1
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Health check failed again at ${new Date().toISOString()}. Auto-rollback attempted.`
              });
              return;
            }

            // Ensure 'incident' label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'incident'
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'incident',
                color: 'FF0000',
                description: 'Production incident'
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Production down — auto-rollback triggered',
              body: [
                '## Production Health Check Failed',
                '',
                `**Time:** ${new Date().toISOString()}`,
                `**Trigger:** ${context.eventName}`,
                '',
                'Auto-rollback to the last working deployment was attempted.',
                'Please investigate the root cause before re-deploying.',
              ].join('\n'),
              labels: ['incident']
            });
